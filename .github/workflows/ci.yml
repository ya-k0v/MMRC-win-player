name: Windows Player CI

on:
  push:
    branches: [main]
    paths:
      - '**'
  pull_request:
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Player
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        working-directory: src/MMRCPlayer
        run: dotnet restore -r win-x64

      - name: Setup VLC native binaries
        shell: powershell
        run: ./setup-vlc.ps1

      - name: Build
        working-directory: src/MMRCPlayer
        run: dotnet publish -c Release -r win-x64 --self-contained true -o ../../publish

      - name: Verify
        shell: pwsh
        run: |
          $exe = "publish\MMRCPlayer.exe"
          $required = @(
            "publish\MMRCPlayer.exe",
            "publish\MMRCPlayer.dll",
            "publish\libvlc.dll",
            "publish\libvlccore.dll",
            "publish\plugins"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              Write-Error "Required publish output is missing: $path"
              exit 1
            }
          }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "MMRCPlayer.exe: $size MB"
          if ($size -lt 5) {
            Write-Error "Self-contained build failed - exe too small"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MMRCPlayer-${{ github.sha }}
          path: publish/
          retention-days: 14